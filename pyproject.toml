[project]
name = "askarxiv"
version = "0.1.0"
description = "Retrieval over six months of cs.AI papers, measured against a hand-written question set."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "pydantic>=2.7",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.5", "mypy>=1.10"]
# sentence-transformers pulls torch — several hundred megabytes. It is not
# needed to harvest, load, or run the test suite, so it is opt-in: nobody
# waits on a torch download to run tests that never import it.
embed = ["sentence-transformers>=3.0", "tiktoken>=0.7"]

[project.scripts]
askarxiv = "askarxiv.cli:app"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

# Without this, setuptools sees sql/, data/, evals/ and results/ as candidate
# packages and refuses to guess. The importable package is askarxiv; the rest
# are data and SQL that ship with the repo, not with the distribution.
[tool.setuptools.packages.find]
include = ["askarxiv*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# typer expresses CLI arguments as call-valued defaults; B008 is a false
# positive for the entire framework, not a smell in this file.
"askarxiv/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a live postgres (make itest)"]
# Makes `pytest` work in a fresh checkout without an editable install first.
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: askarxiv
      POSTGRES_PASSWORD: askarxiv
      POSTGRES_DB: askarxiv
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U askarxiv -d askarxiv"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
